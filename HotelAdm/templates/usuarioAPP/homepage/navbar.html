{% load static %}

{% block content %}
<!-- Navbar de la pagina -->
<nav class="navbar navbar-expand-lg bottom-line navbar-bg">
    <div class="container">
        <a class="navbar-brand" href="/">
            <img src="{% static 'usuarioAPP/imagenes/logo.png' %}" alt="Logo" width="64" height="64">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                {% if user.username %}
                <li class="nav-item">
                    <a href="{% url 'logout' %}" class="nav-link text-light-blue">Cerrar sesión</a>
                </li>
                {% endif %}
                <li class="nav-item"><a class="nav-link text-light-blue" href="/">Inicio</a></li>
                <li class="nav-item"><a class="nav-link text-light-blue" href="servicios">Servicios</a></li>
                <li class="nav-item"><a class="nav-link text-light-blue" href="contacto">Contacto</a></li>
                <!-- Contenedor para botón y nombre de usuario -->
                <div class="user-login d-flex align-items-center">
                    <li class="nav-item"><a class="nav-link btn btn-orange-login" href="dashboard"><i class="fa-solid fa-user"></i></a></li>
                    {% if user.username %}
                        <li class="nav-item nav-link text-light-blue">{{user.username }}</li>
                    {% else %}
                        <li class="nav-item nav-link text-light-blue">Invitado</li>
                    {% endif %}
                </div>
            </ul>
        </div>
    </div>
</nav>

{% endblock %}
