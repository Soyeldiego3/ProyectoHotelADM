{% load static %}
{% block content %}

<title>Login</title>
<style>
    body {
        overflow-y: visible;
        overflow-x: hidden;
        background-color: #2d3250;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .login-container {
        background-color: #424769;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
        text-align: center;
    }

    .login-title {
        color: #ffffff;
        margin-bottom: 20px;
        font-size: 1.8em;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-label {
        color: #b6b9cd;
        display: block;
        margin-bottom: 5px;
    }

    .form-control {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 5px;
        background-color: #2d3250;
        color: #ffffff;
    }

    .form-control:focus {
        outline: 2px solid #f9b37a;
    }

    .btn-login {
        background-color: #f9b37a;
        color: #ffffff;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        width: 100%;
    }

    .btn-login:hover {
        background-color: #e09b63;
    }

    .centrar {
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
        justify-items: center;
    }

    .ajuste {
        margin-top: 30px;
    }
</style>
<body>
    <div class="centrar">
        <div class="login-container">
            <div>
                <a href="/">
                    <img src="{% static 'usuarioAPP/imagenes/logo.png' %}" alt="Logo" width="128" height="128">
                </a> 
            </div>
            <h2 class="login-title">Iniciar Sesión</h2>
            <form>
                <div class="form-group">
                    <label for="email" class="form-label">Usuario/Correo</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn-login">Entrar</button>
            </form>
        </div>
    
        <div class="ajuste">
            <a href="admin/panel" class="btn-login">Admin</a>
            <a href="menuUsuarios" class="btn-login">Usuario</a>
            <a href="menuHoteles" class="btn-login">Hoteles</a>
            <a href="admin/reservasUsuario" class="btn-login">ReservasUsuario</a>
            <a href="admin/reservas" class="btn-login">Reservas</a>
        </div>
    </div>    
</body>

{% endblock %}
