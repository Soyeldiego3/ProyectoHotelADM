{% include 'adminAPP/panel-nav-bar.html' %}
{% block content %}
<div class="container mt-5">
    <!-- Icono de volver -->
    <div class="d-flex justify-content-start mb-3">
        <a href="{% url 'listar_habitaciones' %}" class="btn" style="background-color: #1f2235; color: #f8f9fa; border: 1px solid #f8f9fa; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);">
            <i class="bi bi-arrow-left-circle" style="font-size: 1.5rem;"></i>
            <span style="margin-left: 5px;">Volver</span>
        </a>
    </div>
    <div class="card mx-auto" style="max-width: 600px; background-color: #2a2d43; border: none; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);">
        <div class="card-header text-center" style="background-color: #1f2235; color: #f8f9fa;">
            <h4>Crear Habitación</h4>
        </div>
        <div class="card-body" style="color: #f8f9fa;">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_numero" class="form-label">Número:</label>
                    <input type="text" name="numero" class="form-control" style="background-color: #1f2235; color: #f8f9fa; border: 1px solid #f8f9fa;">
                </div>
                <div class="mb-3">
                    <label for="id_tipo" class="form-label">Tipo:</label>
                    <select name="tipo" class="form-control" style="background-color: #1f2235; color: #f8f9fa; border: 1px solid #f8f9fa;">
                        <option value="estándar">Estándar</option>
                        <option value="suite">Suite</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="id_precio_por_noche" class="form-label">Precio por noche:</label>
                    <input type="number" step="0.01" name="precio_por_noche" class="form-control" style="background-color: #1f2235; color: #f8f9fa; border: 1px solid #f8f9fa;">
                </div>
                <div class="mb-3">
                    <label for="id_hotel" class="form-label">Hotel:</label>
                    <select name="hotel" class="form-control" style="background-color: #1f2235; color: #f8f9fa; border: 1px solid #f8f9fa;">
                        {% for hotel in hoteles %}
                        <option value="{{ hotel.id }}">{{ hotel.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn" style="background-color: #f78e69; color: #ffffff; border: none;">Crear</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
{% include 'index.html' %}
