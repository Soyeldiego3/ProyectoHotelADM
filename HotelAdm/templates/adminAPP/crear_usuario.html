{% include 'adminAPP/panel-nav-bar.html' %}
{% block content %}
<div class="container mt-5">
    <div class="card mx-auto" style="max-width: 600px; background-color: #2a2d43; border: none; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);">
        <div class="card-header text-center" style="background-color: #1f2235; color: #f8f9fa;">
            <h4>Crear Usuario</h4>
        </div>
        <div class="card-body" style="color: #f8f9fa;">
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            {% for error in field.errors %}
                                <div class="invalid-feedback">{{ error }}</div>
                            {% endfor %}
                        {% endif %}
                    </div>
                {% endfor %}
                <div class="d-grid">
                    <button type="submit" class="btn" style="background-color: #f78e69; color: #ffffff; border: none;">Crear</button>
                </div>
                <div class="d-grid mt-3">
                    <a href="javascript:history.back()" class="btn btn-secondary" style="border: none;">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
{% include 'index.html' %}
