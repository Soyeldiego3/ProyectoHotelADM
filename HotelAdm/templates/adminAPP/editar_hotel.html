{% include 'adminAPP/panel-nav-bar.html' %}
{% block content %}
<div class="container mt-5">
    <div class="card mx-auto position-relative" style="max-width: 600px; background-color: #2a2d43; border: none; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);">
        <!-- Botón de eliminar en la esquina superior derecha -->
        <form method="post" style="position: absolute; top: 10px; right: 10px;">
            {% csrf_token %}
            <button type="submit" name="eliminar" class="btn btn-danger btn-sm" onclick="return confirmarDeshabilitar();" title="Eliminar Hotel">
                &times;
            </button>
        </form>
        <div class="card-header text-center" style="background-color: #1f2235; color: #f8f9fa;">
            <h4>Editar Hotel: {{ hotel.nombre }}</h4>
        </div>
        <div class="card-body" style="color: #f8f9fa;">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_nombre" class="form-label">Nombre:</label>
                    <input type="text" id="id_nombre" name="nombre" value="{{ hotel.nombre }}" class="form-control" style="background-color: #1f2235; color: #f8f9fa; border: 1px solid #f8f9fa;">
                </div>
                <div class="mb-3">
                    <label for="id_direccion" class="form-label">Dirección:</label>
                    <textarea id="id_direccion" name="direccion" class="form-control" style="background-color: #1f2235; color: #f8f9fa; border: 1px solid #f8f9fa;">{{ hotel.direccion }}</textarea>
                </div>
                <div class="mb-3">
                    <label for="id_telefono" class="form-label">Teléfono:</label>
                    <input type="text" id="id_telefono" name="telefono" value="{{ hotel.telefono }}" class="form-control" style="background-color: #1f2235; color: #f8f9fa; border: 1px solid #f8f9fa;">
                </div>
                <div class="mb-3">
                    <label for="id_correo" class="form-label">Correo:</label>
                    <input type="email" id="id_correo" name="correo" value="{{ hotel.correo }}" class="form-control" style="background-color: #1f2235; color: #f8f9fa; border: 1px solid #f8f9fa;">
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" name="guardar" class="btn" style="background-color: #f78e69; color: #ffffff; border: none;">
                        Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Confirmación de deshabilitar hotel
    function confirmarDeshabilitar() {
        let confirmacion1 = confirm("¿Estás seguro de que deseas deshabilitar este hotel?");
        if (confirmacion1) {
            return confirm("¿Estás completamente seguro? Esta acción lo deshabilitará.");
        }
        return false;
    }
</script>
{% endblock %}
{% include 'index.html' %}
