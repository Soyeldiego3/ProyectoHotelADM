{% include 'adminAPP/panel-nav-bar.html' %}
{% block content %}
<div class="container mt-5">
    <div class="card mx-auto" style="max-width: 600px; background-color: #2a2d43; border: none; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);">
        <div class="card-header text-center" style="background-color: #1f2235; color: #f8f9fa;">
            <h4>Editar Usuario: {{ form.instance.username }}</h4>
        </div>
        <div class="card-body" style="color: #f8f9fa;">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-grid gap-2">
                    <button type="submit" class="btn" style="background-color: #f78e69; color: #ffffff; border: none;">
                        Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
{% include 'index.html' %}
