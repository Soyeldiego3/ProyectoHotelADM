{% include 'adminAPP/panel-nav-bar.html' %}

{% block content %}
<div class="container">
    <h1>{% if form.instance.pk %}Editar Organización{% else %}Crear Organización{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{% url 'listar_organizaciones' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}

{% include "index.html" %}
