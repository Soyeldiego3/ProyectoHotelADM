<title>Formulario Agregar Usuario</title>
<style>
    body {
        overflow-y: visible; /* Mostrar barra de desplazamiento vertical */
        overflow-x: hidden; /* Ocultar barra de desplazamiento horizontal */
        background-color: #2d3250;
    }

    /* Colores personalizados */
    .bg-dark-blue {
        background-color: #2d3250;
    }

    .bg-light-blue {
        background-color: #424769;
    }

    .text-white {
        color: #ffffff;
    }

    .text-light-blue {
        color: #b6b9cd;
    }

    .contenido {
        margin-right: 5vw;
        margin-left: 5vw;
    }

    @media (min-width: 992px) {
        .contenido {
            margin-right: 25vh;
            margin-left: 25vh;
        }
    }

    .form-container {
        background-color: #424769;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        margin-top: 20px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-label {
        color: #b6b9cd;
        display: block;
        margin-bottom: 5px;
    }

    .form-control {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 5px;
        background-color: #2d3250;
        color: #ffffff;
    }

    .form-control:focus {
        outline: 2px solid #f9b37a;
    }

    .btn-submit {
        background-color: #f9b37a;
        color: #ffffff;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .btn-submit:hover {
        background-color: #e09b63;
    }
</style>

<div class="contenido">
    <div class="form-container">
        <h2 class="text-white">Registro Usuarios</h2>
        <form>
            <div class="form-group">
                <label for="id" class="form-label">ID:</label>
                
            </div>
            <div class="form-group">
                <label for="nombres" class="form-label">Nombres</label>
                <input type="text" id="nombres" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="apellidos" class="form-label">Apellidos</label>
                <input type="text" id="apellidos" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="contraseña" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="correo" class="form-label">Correo</label>
                <input type="email" id="correo" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="rut" class="form-label">RUT</label>
                <input  id="rut" class="form-control" required></textarea>
            </div>
            <div class="form-group">
                <label for="telfono" class="form-label">Telefono</label>
                <input id="contacto" class="form-control" required></textarea>
            </div>
            <center>
            <button type="submit" class="btn-submit">Guardar</button>
        </form>
    </div>
</div>

{% endblock %}
